# Home Credit enriched features, temporal (recency-proxy) split.
# APP_RECENCY_DAYS = most recent previous-application decision in days
# before the current application (max DAYS_DECISION per customer from
# previous_application.csv). Numeric proxy: rows are sorted by it, the
# earliest 75% train, latest 25% test. Missing recency (no previous
# applications) sorts first -> training partition.
#
# Research/education only. The proxy is a recency ordering, NOT true
# calendar time: DAYS_* are all relative to each customer's own
# application date, so this is a documented approximation of temporal
# validation, not a substitute for an absolute-time dataset.
dataset_path: data/raw/home_credit/application_train_enriched.csv
target_column: TARGET
id_column: SK_ID_CURR
time_column: prev_APP_RECENCY_DAYS
protected_group_column: null
positive_label: 1
random_seed: 42
test_size: 0.25
models: [logistic_regression, hist_gradient_boosting, random_forest]
explanation: {fraction: 0.02, sample_size: 100}
